services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: contextforge
      POSTGRES_USER: contextforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextforge -d contextforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://contextforge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/contextforge
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRED: "true"
      API_KEY: ${API_KEY:?set API_KEY in .env}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
