name: CI

on:
  push:
    paths: ["contextforge/**"]
  pull_request:
    paths: ["contextforge/**"]

defaults:
  run:
    working-directory: contextforge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: ruff check app tests
      - run: pytest
